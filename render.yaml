services:
  # Servicio 1: La Web App (Django/Gunicorn)
  - type: web
    name: plataforma-web
    env: python
    plan: starter
    region: oregon
    buildFilter:
      paths:
      - "**/*.py"
      - "requirements.txt"
    # OCR ahora via OpenRouter: ya no hace falta torch/easyocr (build liviano).
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    # 1 worker (poca RAM) + 4 threads: los threads comparten memoria (no suben el
    # OOM) y permiten responder el health check mientras un thread espera a la IA.
    # --timeout 180: generar muchas preguntas tarda más que los 30s por defecto.
    startCommand: "gunicorn plataforma.wsgi --workers 1 --threads 4 --timeout 180 --max-requests 150 --max-requests-jitter 30"
    healthCheckPath: /health/
    envVars:
      # DB real en Neon. Valor cargado a mano en el dashboard (NO lo maneja el
      # blueprint, para que un sync no lo pise). Ver plataforma-db abajo: queda
      # definida pero sin usar (es la free vacía de Render).
      - key: DATABASE_URL
        sync: false
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: plataforma-redis
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 1
      # IA — OpenRouter. El valor se carga a mano en el dashboard (no se commitea).
      - key: OPENROUTER_API_KEY
        sync: false

  # Servicio 2: El Worker Asíncrono (Celery)
  - type: worker
    name: plataforma-worker
    env: python
    plan: starter
    region: oregon
    buildFilter:
      paths:
      - "**/*.py"
      - "requirements.txt"
    # OCR ahora via OpenRouter: ya no hace falta torch/easyocr.
    buildCommand: "pip install -r requirements.txt"
    # --concurrency=1: Celery por defecto abre 1 proceso por CPU que ve el
    # contenedor (muchas en Render) y cada uno carga Django+WeasyPrint -> OOM.
    # --max-tasks-per-child recicla para no acumular memoria.
    startCommand: "celery -A plataforma worker -l info --concurrency=1 --max-tasks-per-child=100"
    envVars:
      # DB real en Neon. Valor cargado a mano en el dashboard (NO lo maneja el
      # blueprint, para que un sync no lo pise). Ver plataforma-db abajo: queda
      # definida pero sin usar (es la free vacía de Render).
      - key: DATABASE_URL
        sync: false
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: plataforma-redis
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true

  # Servicio 3: El Broker de Tareas (Redis)
  - type: redis
    name: plataforma-redis
    plan: free
    region: oregon
    ipAllowList:
      - source: 0.0.0.0/0
        description: "Permitir todas las IPs (MVP)"

databases:
  - name: plataforma-db
    plan: free
    region: oregon
